<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>S3 Deployment Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: rgba(0, 0, 0, 0.3);
            padding: 40px;
            border-radius: 12px;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Deployment Successful!</h1>
        <p>Your website is being served from Amazon S3.</p>
        <p>If you see this page, GitHub Actions is working correctly.</p>
        <p><strong>Time:</strong> <span id="time"></span></p>
    </div>

    <script>
        document.getElementById("time").textContent = new Date().toLocaleString();
    </script>
</body>
</html>
